<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instrument SOPs — Molecular Plant Pathology Laboratory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1E3A6E; --navy-deep:#152A52; --ink:#1B2437; --muted:#5A6478;
  --paper:#F5F7FA; --card:#FFFFFF; --line:#D8DEE9;
  --amber:#8A5A00; --amber-bg:#FFF7E0; --amber-line:#E4B84A;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--paper);color:var(--ink);line-height:1.55;font-size:16px}
a{color:var(--navy)}

header{background:var(--navy);color:#fff;padding:18px 20px 16px;border-bottom:4px solid var(--navy-deep)}
header h1{font-size:1.15rem;font-weight:700;letter-spacing:.01em}
header p{font-size:.82rem;opacity:.85;margin-top:2px}

.wrap{max-width:1080px;margin:0 auto;padding:0 16px 48px}
@media(min-width:880px){
  .wrap{display:grid;grid-template-columns:340px 1fr;gap:28px;align-items:start}
  #listPane{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto;padding-right:4px}
}

.searchbox{margin:18px 0 14px}
.searchbox input{width:100%;padding:11px 14px;font:inherit;font-size:.95rem;
  border:1.5px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.searchbox input:focus{outline:2px solid var(--navy);outline-offset:1px;border-color:var(--navy)}

.group{margin-bottom:18px}
.group h2{font-size:.8rem;font-weight:600;color:var(--muted);margin:0 0 7px 2px;letter-spacing:.02em}
.label-strip{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;
  background:var(--navy);color:#fff;border:0;border-radius:4px;padding:10px 14px;margin-bottom:6px;
  font:inherit;font-weight:600;font-size:.92rem;cursor:pointer;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.label-strip .num{font-weight:400;font-size:.78rem;opacity:.75;min-width:2.2em}
.label-strip:hover{background:var(--navy-deep)}
.label-strip:focus-visible{outline:3px solid var(--amber-line);outline-offset:2px}
.label-strip.active{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 2px var(--navy)}
.nores{color:var(--muted);font-size:.9rem;padding:8px 2px}

#sopPane{margin-top:18px}
.placeholder{background:var(--card);border:1.5px dashed var(--line);border-radius:8px;
  padding:38px 24px;text-align:center;color:var(--muted);font-size:.95rem}

article{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sop-head{background:var(--navy);color:#fff;padding:16px 20px}
.sop-head .sopno{font-size:.78rem;opacity:.8}
.sop-head h2{font-size:1.25rem;font-weight:700;line-height:1.3;margin-top:2px}
.sop-head .model{font-size:.85rem;opacity:.9;font-style:italic;margin-top:4px}
.sop-body{padding:18px 20px 24px}
.sop-body h3{font-size:.95rem;font-weight:700;color:var(--navy);margin:20px 0 8px}
.sop-body h3:first-child{margin-top:2px}
.sop-body p{font-size:.94rem;max-width:70ch}
.sop-body ol,.sop-body ul{padding-left:1.35em;max-width:70ch}
.sop-body li{margin-bottom:7px;font-size:.94rem}
.caution{background:var(--amber-bg);border-left:4px solid var(--amber-line);
  border-radius:0 6px 6px 0;padding:12px 16px 12px 14px;margin-top:6px}
.caution ul{padding-left:1.2em}
.caution li{color:var(--amber)}
.backbar{display:none;margin:14px 0 0}
.backbar button{font:inherit;font-weight:600;font-size:.9rem;color:var(--navy);
  background:none;border:1.5px solid var(--navy);border-radius:6px;padding:8px 16px;cursor:pointer}
@media(max-width:879px){
  body.viewing #listPane{display:none}
  body.viewing .backbar{display:block}
}
@media print{
  header,.searchbox,#listPane,.backbar{display:none}
  body{background:#fff}
  article{border:none}
  .sop-head{background:#fff;color:var(--ink);border-bottom:2px solid var(--ink)}
}
footer{max-width:1080px;margin:0 auto;padding:12px 16px 32px;color:var(--muted);font-size:.78rem}
</style>
</head>
<body>
<header>
  <h1>Instrument Standard Operating Procedures</h1>
  <p>Molecular Plant Pathology Laboratory · Dept. of Plant Pathology, BACA, AAU, Anand</p>
</header>

<div class="wrap">
  <div id="listPane">
    <div class="searchbox">
      <input id="search" type="search" placeholder="Search instruments (e.g. centrifuge, pH, PCR)" aria-label="Search instruments">
    </div>
    <nav id="groups" aria-label="Instrument list"></nav>
  </div>

  <div id="sopPane">
    <div class="placeholder" id="placeholder">Select an instrument to view its SOP.</div>
    <div id="sopView"></div>
    <div class="backbar"><button id="backBtn">&#8592; Back to instrument list</button></div>
  </div>
</div>

<footer>Prepared by Suraj Kumar Thakor · Read the SOP fully before first use of any instrument · Report faults to the laboratory in-charge.</footer>

<script>
const DATA = {"groups": [{"name": "General laboratory equipment", "ids": [1, 3, 5, 15, 16, 19]}, {"name": "Temperature control", "ids": [2, 6]}, {"name": "Mixing & centrifugation", "ids": [4, 7, 8, 9, 11]}, {"name": "Electrophoresis & molecular analysis", "ids": [10, 12, 13, 14, 17, 18, 20]}, {"name": "Sterilisation & aseptic work", "ids": [21, 22, 23, 24]}], "sops": {"1": {"title": "Electronic Weighing Balance", "model": "Optart digital balance", "purpose": "Accurate weighing of media components, chemicals and reagents for preparation of culture media, buffers and stock solutions.", "procedure": ["Place the balance on a firm, level, vibration-free surface away from draughts and direct sunlight.", "Switch on the mains supply; confirm the 'AC ON' indicator lights and allow the balance to warm up for 10–15 minutes.", "Press TARE/ZERO to bring the display to zero.", "Place a clean weighing boat, butter paper or beaker on the pan and press TARE/ZERO again to nullify its weight.", "Add the substance slowly with a clean spatula until the desired weight is displayed; use GROSS/NET to toggle between gross and net weight if required.", "Record the reading, remove the sample carefully and clean any spillage immediately.", "Press TARE/ZERO to reset and switch off after use."], "precautions": ["Never exceed the maximum capacity of the balance.", "Do not weigh hygroscopic or volatile chemicals in open containers for prolonged periods.", "Never place chemicals directly on the pan; always use a weighing boat or paper.", "Clean spilt chemicals immediately with a soft brush to prevent corrosion of the pan."], "maintenance": "Keep the pan and housing clean and dry. Verify accuracy periodically with standard weights and record calibration in the log book."}, "2": {"title": "Serological Water Bath (Six-hole)", "model": "Electroquip, with i-therm AI-7782D digital temperature controller", "purpose": "Maintaining a constant temperature for incubation of samples, melting and holding of agar/agarose media, serological reactions and enzyme assays.", "procedure": ["Check the water level; fill with distilled water to about two-thirds of the tank depth, ensuring the heating element is fully submerged.", "Switch on the mains and turn on the unit using the power switch.", "Set the required temperature on the digital controller using the SET and arrow keys; PV shows the process (actual) value and SV the set value.", "Allow the bath to attain and stabilise at the set temperature before placing samples.", "Place flasks/tubes in the holes using the concentric ring covers to suit vessel size; keep unused holes covered to minimise evaporation and heat loss.", "After use, remove samples, switch off the unit and the mains supply."], "precautions": ["Never operate the bath without water; dry heating will damage the element.", "Use distilled water only, to prevent scale deposition.", "Do not set temperatures above the recommended limit; use lids at high temperatures to reduce evaporation.", "Handle hot vessels with tongs or heat-resistant gloves."], "maintenance": "Drain and clean the tank weekly to prevent microbial growth and scale. Top up water daily during continuous use. Check controller accuracy against a calibrated thermometer periodically."}, "3": {"title": "Ice Making Machine", "model": "MAC ice cuber", "purpose": "Production of ice cubes for maintaining low temperature of enzymes, nucleic acids, reagents and samples during molecular biology work.", "procedure": ["Ensure continuous water supply and power connection to the machine.", "Switch on the machine; ice formation and harvest occur automatically in cycles.", "Open the front bin door and collect ice using the dedicated clean scoop only.", "Close the bin door promptly after collection to prevent melting and contamination."], "precautions": ["Never handle ice with bare hands or contaminated gloves; use the scoop.", "Do not store ice buckets, tubes or samples inside the ice bin.", "Do not use the ice for human consumption; it is for laboratory use only.", "Report water leakage or unusual noise immediately."], "maintenance": "Clean and sanitise the storage bin and scoop fortnightly. Check the water filter and inlet periodically. Defrost and clean the machine as per the manufacturer's schedule."}, "4": {"title": "Refrigerated Benchtop Centrifuge", "model": "Thermo Scientific Sorvall ST 8R", "purpose": "Separation of cells, cell debris, precipitated nucleic acids and proteins from suspensions at controlled temperature (commonly 4 °C).", "procedure": ["Switch on the instrument and set the required temperature; allow the chamber to pre-cool for temperature-sensitive work.", "Select the appropriate rotor and buckets/adapters for the tube type in use.", "Balance tubes in pairs by weight (not volume) and load them diametrically opposite one another.", "Close the lid until it locks. Set speed (rpm or rcf), time and acceleration/deceleration profiles using the panel keys.", "Press START and remain nearby until full speed is attained without vibration.", "After the run, wait for the rotor to stop completely, press OPEN, and remove tubes carefully without disturbing pellets.", "Leave the lid open briefly to dissipate condensation, then close and switch off."], "precautions": ["Never centrifuge unbalanced loads; imbalance damages the rotor and motor.", "Do not exceed the maximum rated speed of the rotor or tubes.", "Never open the lid or attempt to stop the rotor by hand while it is spinning.", "Wipe spills inside the chamber immediately, particularly of infectious or corrosive material."], "maintenance": "Clean the rotor, buckets and chamber weekly with a mild detergent and dry thoroughly. Inspect rotors for corrosion or cracks. Record usage in the log book."}, "5": {"title": "Microwave Oven", "model": "Samsung (Grill)", "purpose": "Rapid melting of agarose for gel electrophoresis and heating/sterilisation-assisted melting of laboratory media (non-food use).", "procedure": ["Place the agarose flask (loosely capped or cotton-plugged, never sealed) on the turntable.", "Close the door, select an appropriate power level and set the time.", "Heat in short bursts of 30–60 seconds, swirling the flask between bursts until the agarose dissolves completely.", "Allow the flask to stand briefly before removal; handle with heat-resistant gloves."], "precautions": ["Never heat sealed containers; superheated liquids may erupt violently (bumping) — swirl with care.", "Do not place metal objects, foil or metal-capped bottles inside.", "Never run the oven empty.", "Do not use the laboratory microwave for food or beverages."], "maintenance": "Wipe the cavity and turntable after any spill. Check the door seal periodically; report any damage before further use."}, "6": {"title": "Refrigerated Circulating Water Bath", "model": "Grant, with GR150 controller", "purpose": "Precise temperature control, including sub-ambient temperatures, for incubations, enzymatic reactions and temperature-sensitive assays.", "procedure": ["Check that the bath is filled with distilled water to the recommended level.", "Switch on the mains and the unit power switch.", "Set the desired temperature on the GR150 controller using the function (F) and set (S) keys with the dial.", "Allow the bath to reach and stabilise at the set point before immersing samples.", "Place samples securely in racks; avoid overcrowding so that water circulates freely.", "After use, remove samples, switch off the unit and cover the bath."], "precautions": ["Never run the unit dry; the pump and heater require liquid.", "Keep the ventilation grilles at the front unobstructed.", "Do not allow water level to drop below the circulation inlet.", "Mop external spills promptly to protect the electrics."], "maintenance": "Change the water weekly and clean the tank to prevent algal growth. Clean the condenser grille of dust monthly. Verify displayed temperature against a reference thermometer periodically."}, "7": {"title": "Mini / Personal Centrifuge (Microcentrifuge)", "model": "Benchtop mini centrifuges with fixed-angle and PCR strip rotors", "purpose": "Quick spin-down of small volumes in microcentrifuge tubes and PCR tubes/strips to collect liquid at the tube bottom before and after reactions.", "procedure": ["Place the centrifuge on a level surface and connect the power adapter.", "Open the lid and load tubes symmetrically in the rotor; always balance opposite positions with tubes of equal volume.", "For PCR strips, use the strip rotor and load complete or balanced strips.", "Close the lid to start the spin (most mini centrifuges start on lid closure); spin briefly (a few seconds to one minute).", "Open the lid only after the rotor has come to a complete stop, and remove the tubes."], "precautions": ["Do not open the lid until the rotor stops, as marked on the instrument.", "Do not run with unbalanced loads or with cracked tubes.", "Do not exceed brief spin durations; these units are not substitutes for high-speed centrifugation."], "maintenance": "Keep the rotor and housing clean and dry. Wipe up any spill immediately. Check the rotor seating periodically."}, "8": {"title": "Digital Vortex Mixer", "model": "VELP Scientifica TX4 Digital IR Vortex Mixer", "purpose": "Rapid mixing and homogenisation of samples in tubes, including multi-tube mixing using the foam tube holder.", "procedure": ["Place the mixer on a stable bench and switch on using the ON/OFF switch.", "For single tubes in touch mode, press the tube cup gently with the tube base to activate vortexing.", "For continuous mode or multiple tubes, fit the multi-tube foam holder, load capped tubes, set the speed with the control knob and start the run.", "Adjust the speed to obtain thorough mixing without splashing or foaming.", "Switch off after use and remove tubes."], "precautions": ["Ensure all tubes are tightly capped before vortexing.", "Do not vortex open containers of hazardous or infectious material.", "Avoid prolonged vortexing of shear-sensitive samples such as high-molecular-weight genomic DNA; mix gently instead."], "maintenance": "Keep the platform and foam attachment clean and dry. Inspect the rubber cup for wear and replace when damaged."}, "9": {"title": "Refrigerated Microcentrifuge", "model": "Eppendorf Centrifuge 5418 R", "purpose": "High-speed centrifugation of 1.5/2.0 mL microcentrifuge tubes at controlled temperature for nucleic acid precipitation, phase separation and pelleting.", "procedure": ["Switch on the instrument and set the required temperature with the temp arrow keys; use 'fast temp' to pre-cool the chamber when needed.", "Load balanced tubes (equal weight) in opposite rotor positions and close the rotor lid, then the centrifuge lid.", "Set the speed with the speed dial (press rpm/rcf to toggle units) and the run time with the time dial.", "Press the time dial (start/stop) to begin the run; use 'short' for momentary spins.", "After the run ends and the rotor stops, press 'open', remove tubes and close the lid.", "Switch off after the session and leave the lid ajar to prevent condensation and odour."], "precautions": ["Balance tubes precisely; even small imbalances matter at high speed.", "Use only intact tubes rated for the intended g-force.", "Do not open the lid while the rotor is moving.", "Wipe condensation and spills from the chamber after refrigerated runs."], "maintenance": "Clean the rotor and chamber weekly; dry thoroughly. Check the rotor lid seal. Have the unit serviced and calibrated as per the maintenance schedule."}, "10": {"title": "UV Transilluminator", "model": "UVP Ultraviolet Transilluminator", "purpose": "Visualisation of ethidium-bromide- or other fluorophore-stained nucleic acids in agarose gels after electrophoresis.", "procedure": ["Place the instrument in the gel documentation area; wipe the filter glass clean before use.", "Place the stained gel centrally on the UV filter surface.", "Close/position the UV-protective cover, wear a UV face shield and gloves, and switch ON.", "Select HI or LOW intensity as required; use LOW and minimum exposure time when bands are to be excised, to limit nucleic acid damage.", "Observe or photograph the gel, then switch OFF immediately.", "Remove the gel and wipe the surface with a damp tissue followed by 70 % ethanol."], "precautions": ["Never view the UV surface with unprotected eyes or skin; UV-B/UV-C causes burns and eye injury.", "Always wear a face shield, lab coat and nitrile gloves.", "Treat gel-contact surfaces as ethidium bromide-contaminated; decontaminate after use.", "Keep exposure of gels to UV as brief as possible to avoid nicking DNA."], "maintenance": "Clean the filter glass after every use. Do not scratch the filter. Report flickering lamps or reduced intensity for lamp replacement."}, "11": {"title": "Vortexer (Bioanalyzer Chip Vortexer)", "model": "IKA MS 3 Vortexer", "purpose": "Controlled vortex mixing, principally of Agilent 2100 Bioanalyzer chips at the specified speed prior to chip runs.", "procedure": ["Connect the power adapter and fit the appropriate attachment (chip holder for Bioanalyzer chips).", "Set the speed with the dial — for Bioanalyzer chips use the speed specified in the assay protocol (typically 2400 rpm as marked).", "Place the loaded chip securely in the holder.", "Press Start/Stop and vortex for the time specified in the kit protocol (commonly 60 seconds).", "Press Start/Stop to end and remove the chip carefully without tilting."], "precautions": ["As labelled on the instrument, use this unit only with the Agilent 2100 Bioanalyzer application; do not use it for general-purpose vortexing.", "Do not exceed the speed specified in the chip protocol; overspeeding displaces well contents.", "Handle loaded chips level to avoid cross-well contamination."], "maintenance": "Keep the chip adapter clean and free of spilt gel/dye. Store the correct adapter with the instrument."}, "12": {"title": "Electrophoresis Power Supply", "model": "Bio-Rad PowerPac Basic", "purpose": "Providing regulated DC power (constant voltage or current) to horizontal and vertical electrophoresis cells.", "procedure": ["Place the power pack on a dry bench and switch on the mains.", "Connect the electrophoresis tank leads: red (positive/anode) to red, black (negative/cathode) to black.", "Switch on the unit; select constant voltage or constant current using the V/A key.", "Set the required value with the arrow keys (e.g. 80–120 V for routine agarose gels).", "Press Run/Pause to start; confirm current is flowing (mA reading and fine bubbles at the electrodes).", "On completion, press Stop, switch off the unit, and only then disconnect the leads."], "precautions": ["Electrical hazard: never connect or disconnect leads while the output is live.", "Ensure the tank lid is in place before starting the run.", "Keep the unit and connections dry; wipe buffer spills immediately.", "Do not operate with damaged leads or connectors."], "maintenance": "Keep sockets clean and dry. Inspect leads for cracked insulation. Report error codes or unstable output to the laboratory in-charge."}, "13": {"title": "Horizontal Gel Electrophoresis Unit", "model": "Bio-Rad horizontal submarine gel system", "purpose": "Separation of DNA/RNA fragments in agarose gels according to molecular size under an electric field.", "procedure": ["Assemble the casting tray with dams/tape, place the comb, and pour molten agarose (cooled to ~55 °C) containing the appropriate stain; allow it to set.", "Remove the dams and comb, orient the gel with wells towards the cathode (black), and place it in the tank.", "Fill with 1× running buffer (TAE/TBE) until the gel is submerged by 3–5 mm; check with the spirit level that the tank is horizontal.", "Load samples mixed with loading dye into the wells, along with a molecular-weight marker.", "Fit the lid, connect leads to the power supply observing polarity (DNA migrates towards the anode/red) and run at the set voltage.", "Track dye migration; stop the run, switch off the power supply, then remove the gel for visualisation."], "precautions": ["Never open the lid or touch the buffer while power is on.", "Handle stained gels and buffers with gloves; ethidium bromide is mutagenic.", "Do not let the gel run dry; maintain buffer level above the gel.", "Confirm correct polarity before starting, or samples will run out of the wells."], "maintenance": "Rinse the tank, tray and combs with distilled water after every run; never use abrasives. Inspect electrode wires for breaks. Store combs flat to prevent warping."}, "14": {"title": "Gel Electrophoresis Unit", "model": "Cleaver Scientific horizontal gel unit", "purpose": "Routine agarose gel electrophoresis of PCR products and genomic DNA (companion unit to the Bio-Rad system).", "procedure": ["Cast the agarose gel in the unit's casting tray with the supplied comb and allow it to set.", "Place the gel in the tank with wells at the cathode end and submerge in 1× running buffer.", "Load samples and marker, fit the safety lid, and connect the leads to the power supply with correct polarity.", "Run at the required voltage until the tracking dye has migrated sufficiently.", "Switch off and disconnect the power supply before opening the lid and removing the gel."], "precautions": ["Operate only with the lid fitted; the unit carries an electrical-hazard warning.", "Use gloves when handling gels and stains.", "Do not exceed the voltage recommended for the tank size (excess heat melts gels and warps tanks)."], "maintenance": "Rinse all components with distilled water after use and air-dry. Check the lid contacts and leads periodically."}, "15": {"title": "Laboratory Refrigerator", "model": "LG refrigerator (set at 0–4 °C), ID No. BACA/PP/18355/6(1)/5/2009", "purpose": "Storage of reagents, buffers, media, enzymes (short-term), antibiotic stocks and samples requiring 0–4 °C.", "procedure": ["Verify the display temperature (approximately 0–4 °C) before storing material.", "Label all items with contents, date and user name before placing them inside.", "Store solutions upright with tight caps; keep molecular-biology reagents on designated shelves.", "Close the door promptly and firmly after every use.", "Record any temperature deviation and inform the laboratory in-charge."], "precautions": ["As per the notice on the unit, the following are NOT to be stored in this refrigerator: CI (chloroform–isoamyl alcohol), 0.5 M EDTA, 1 M Tris-HCl, 5 M NaCl and CTAB (these are kept at room temperature).", "Isopropanol and absolute alcohol are to be chilled in the deep freezer before use, not stored here.", "Do not store food or drink in the laboratory refrigerator.", "Do not overload shelves or block air circulation vents.", "Do not store flammable solvents in a domestic (non-spark-free) refrigerator."], "maintenance": "Defrost and clean monthly. Check door gaskets for sealing. Log temperature daily. Discard expired or unlabelled material during periodic clean-outs."}, "16": {"title": "pH / Conductivity Meter", "model": "Oakton PC 700 (pH/mV/Conductivity/°C/°F)", "purpose": "Measurement and adjustment of pH (and conductivity) of buffers, media and reagent solutions.", "procedure": ["Remove the electrode from storage solution, rinse with distilled water and blot gently (do not wipe).", "Switch on the meter with the power key and select the required mode using MODE.", "Calibrate with fresh standard buffers (pH 4.0, 7.0 and 9.2/10.0) using CAL/MEAS, rinsing the electrode between buffers.", "Immerse the electrode in the stirred sample, press ENTER/RANGE if needed, and allow the reading to stabilise (use HOLD to freeze the value).", "Record the reading; adjust solution pH dropwise with acid/alkali while monitoring.", "Rinse the electrode and return it to the storage solution (3 M KCl); switch off the meter."], "precautions": ["Never let the glass electrode dry out or touch the vessel bottom.", "Do not use the pH electrode in strong HF or abrasive suspensions.", "Calibrate daily, or before critical measurements.", "Handle the fragile glass bulb with care."], "maintenance": "Keep the electrode filled/stored in KCl solution. Replace calibration buffers regularly. Clean protein or media deposits from the bulb with the recommended cleaning solution."}, "17": {"title": "Real-Time PCR System (qPCR)", "model": "Bio-Rad CFX Opus 96 Real-Time PCR System", "purpose": "Quantitative PCR for detection and quantification of pathogen DNA/RNA, gene expression studies and melt-curve analysis.", "procedure": ["Switch on the instrument and the connected UPS; allow self-test to complete.", "Prepare the reaction plate/strips on ice with master mix, primers/probe and template; seal with optical film or flat optical caps, avoiding fingerprints on the optical surface.", "Briefly spin the plate to collect contents and remove bubbles.", "Open the lid via the touch screen or software, seat the plate with well A1 at the marked corner and close the lid.", "Create or select the protocol (thermal profile, scan mode, plate layout) on the touch screen or in CFX Maestro software and start the run.", "After completion, remove the plate, analyse data (Cq values, standard curve, melt curve) and export results.", "Discard the used sealed plate without opening it in the pre-PCR area, and switch off the instrument."], "precautions": ["Maintain strict separation of pre- and post-PCR areas to prevent amplicon contamination.", "Use filter tips and gloves throughout; change gloves if contamination is suspected.", "Do not write on or scratch the optical seal.", "Do not switch off power during a run; use the UPS."], "maintenance": "Keep the sample block clean; remove dust from vents. Run periodic background calibration as recommended. Record every run in the instrument log."}, "18": {"title": "Bioanalyzer (Microfluidic Electrophoresis)", "model": "Agilent 2100 Bioanalyzer, ID No. BACA/PP/12993-18/7(1)/89/2017", "purpose": "Sizing, quantification and quality assessment of DNA, RNA (RIN determination) and proteins on microfluidic chips.", "procedure": ["Switch on the instrument and start the 2100 Expert software on the connected computer.", "Equilibrate kit reagents to room temperature and prepare the gel–dye mix as per the assay kit protocol.", "Prime the chip with gel–dye mix using the chip priming station, then load marker, ladder and samples into the designated wells.", "Vortex the chip on the IKA MS 3 vortexer at the specified speed and time (typically 2400 rpm, 60 s).", "Place the chip in the receptacle within 5 minutes, close the lid, select the assay in the software and start the run.", "Review the electropherogram/virtual gel, save the data, and remove and discard the chip.", "Clean the electrodes with the electrode-cleaning chip containing RNase-free water, air-dry, and close the lid."], "precautions": ["Handle the electrode cartridge and chips carefully; do not touch the pins.", "Use RNase-free technique for RNA assays (gloves, RNase-free water, decontaminated surfaces).", "Do not leave a loaded chip standing; run it immediately after loading.", "Keep the instrument on a vibration-free bench (housed in its acrylic cover)."], "maintenance": "Clean electrodes after every run. Store kits at recommended temperatures. Keep the acrylic dust cover in place when idle."}, "19": {"title": "Hot Plate Magnetic Stirrer", "model": "Cole-Parmer digital hot plate stirrer", "purpose": "Simultaneous heating and stirring of solutions during buffer and media preparation, and dissolution of reagents.", "procedure": ["Place the vessel centrally on the ceramic top plate and add a clean magnetic stir bar.", "Switch on with the ON/OFF key.", "Set the stirring speed with the stirrer rpm dial, increasing gradually until a stable vortex forms without splashing.", "If heating is required, set the temperature with the heating °C dial; the 'Heating ON' indicator shows active heating. Use the external probe for accurate solution-temperature control where fitted.", "On completion, turn the heat dial OFF first, allow the plate to cool, then stop stirring and switch off.", "Retrieve the stir bar with a magnetic retriever."], "precautions": ["The ceramic plate remains hot after switch-off; do not touch it and keep flammables away.", "Do not heat sealed vessels.", "Use borosilicate glassware for heating; never place plastic beakers on a hot plate.", "Wipe chemical spills from the plate only after it has cooled."], "maintenance": "Keep the plate surface clean and free of chemical deposits. Check the probe and lead condition. Confirm the temperature accuracy periodically."}, "20": {"title": "Thermal Cycler (Conventional PCR)", "model": "Applied Biosystems MiniAmp Plus Thermal Cycler", "purpose": "Amplification of target DNA sequences by polymerase chain reaction for ITS/species-specific detection, RAPD/ISSR/SSR profiling and general molecular work.", "procedure": ["Switch on the instrument and connect it to the stabiliser/UPS.", "Prepare PCR reaction mixes on ice in PCR tubes/strips/plates and cap or seal them securely.", "Slide open the heated lid, load the tubes in the block and close the lid until it engages.", "On the touch screen, create or select the required programme (initial denaturation, cycling steps of denaturation–annealing–extension, final extension, hold at 4 °C).", "Verify the reaction volume setting matches the actual volume, then start the run.", "After the run, remove the tubes, close the lid, and switch off the instrument.", "Store the products at 4 °C or −20 °C until electrophoresis."], "precautions": ["Use thin-walled PCR tubes rated for the block; poorly fitting tubes cause temperature lag.", "Do not open the heated lid during a run.", "Keep the block clean; a single burst tube can contaminate subsequent runs.", "Avoid prolonged 4 °C holds overnight where possible; transfer products to the refrigerator."], "maintenance": "Clean the block wells periodically with lint-free swabs and 70 % ethanol (when cool). Verify block temperature calibration as scheduled. Log all runs."}, "21": {"title": "Hot Air Oven", "model": "Laboratory hot air oven (thermostatically controlled)", "purpose": "Dry-heat sterilisation of glassware (Petri plates, pipettes, flasks) and metal instruments, and drying of glassware and plant/soil samples.", "procedure": ["Wrap clean, dry glassware in aluminium foil or kraft paper, or place in stainless-steel canisters; plug pipettes and flasks with cotton.", "Load the material loosely on the perforated shelves, leaving space between items for hot-air circulation.", "Close the door firmly, switch on the mains and the oven, and set the thermostat to the required temperature.", "For sterilisation, hold at 160 °C for 2 hours or 180 °C for 1 hour, counted after the set temperature is attained; for drying, use 60–100 °C as required.", "After the holding period, switch off the oven and allow it to cool below 60 °C before opening the door.", "Remove the sterilised material with heat-resistant gloves and store it in a clean, dry place; record the cycle in the log book."], "precautions": ["Never sterilise liquids, rubber, plastics, culture media or flammable material in the hot air oven.", "Do not open the door during the holding period; sudden cooling cracks glassware and breaks sterility.", "Do not overload the chamber or let material touch the walls or heating elements.", "Ensure glassware is completely dry before loading; wet glassware may crack."], "maintenance": "Clean the interior weekly and wipe spills after cooling. Verify thermostat accuracy periodically with a calibrated thermometer. Check the door gasket and ventilator condition."}, "22": {"title": "Autoclave (Steam Steriliser)", "model": "Vertical laboratory autoclave", "purpose": "Moist-heat sterilisation of culture media, distilled water, buffers, glassware, inoculation tools and decontamination of used cultures and biohazard waste.", "procedure": ["Check the water level in the chamber/boiler and top up with clean or distilled water to the marked level.", "Load media flasks and bottles with caps loosened, tubes in baskets, and waste in autoclavable bags; do not pack tightly.", "Close the lid, tightening diametrically opposite wing nuts alternately to seat the gasket evenly.", "Switch on the heater with the steam-release (air-vent) valve open; allow steam to issue freely for several minutes to displace all air.", "Close the valve and allow pressure to rise to 15 psi (121 °C); maintain for 15–20 minutes for media, or 30–60 minutes for waste loads.", "Switch off the heater and let the pressure fall to zero on its own; never vent hot liquid loads rapidly.", "Open the lid away from the face, remove the material with gloves, and tighten caps once cooled. Record the cycle and check the sterilisation indicator (autoclave tape/strip)."], "precautions": ["Never open the autoclave while the pressure gauge reads above zero; risk of severe scalding.", "Do not autoclave sealed bottles; they may burst.", "Never autoclave flammable solvents, corrosives, or bleach-containing solutions.", "Ensure complete air removal; trapped air lowers the effective temperature and sterilisation fails.", "Do not fill vessels beyond two-thirds capacity; media boil over during depressurisation."], "maintenance": "Drain and replace the water weekly. Clean the chamber and check the gasket, pressure gauge and safety valve monthly. Validate performance periodically with biological or chemical indicators."}, "23": {"title": "BOD Incubator", "model": "Biological Oxygen Demand (low-temperature) incubator", "purpose": "Incubation of fungal and bacterial cultures, pathogenicity assay material and seed samples at controlled low temperatures (commonly 20–30 °C, e.g. 25 ± 2 °C for most plant-pathogenic fungi).", "procedure": ["Switch on the mains and the incubator; set the required temperature on the digital controller.", "Allow the chamber to stabilise at the set temperature before loading.", "Place labelled Petri plates (inverted), slants or flasks on the trays with adequate spacing for air circulation.", "Close the door gently and firmly; avoid frequent or prolonged opening.", "Check and record the chamber temperature daily during incubation.", "After the incubation period, remove the cultures and clean any spillage on the trays."], "precautions": ["Do not keep contaminated or sporulating cultures open inside; seal plates with parafilm where required.", "Do not obstruct the air-circulation fan or overload the trays.", "Avoid placing the incubator in direct sunlight or near heat sources.", "Decontaminate immediately if a culture spills inside the chamber."], "maintenance": "Clean the interior with 70 % ethanol weekly and after any spill. Defrost if ice forms on the cooling coil. Verify temperature uniformity periodically with a calibrated thermometer and record in the log."}, "24": {"title": "Laminar Air Flow Cabinet", "model": "Horizontal/vertical laminar air flow bench with HEPA filter and UV lamp", "purpose": "Providing a sterile, particle-free working zone for media pouring, isolation, sub-culturing, inoculation and other aseptic microbiological and molecular operations.", "procedure": ["Wipe the work surface with 70 % ethanol and place only the required sterile items inside.", "Close the front shutter and switch on the UV lamp for 15–20 minutes for surface decontamination; keep out of the room or away from the cabinet during UV exposure.", "Switch off the UV lamp, then switch on the blower and fluorescent light; allow the airflow to run for 10–15 minutes before starting work.", "Wash hands, wear a clean lab coat and gloves, and swab hands/gloves with 70 % ethanol before working.", "Work at least 15 cm inside the front edge, keeping the spirit lamp/burner use to the minimum necessary and avoiding blocking the airflow with large objects.", "On completion, remove all material, wipe the surface with 70 % ethanol, const groupsEl = document.getElementById('groups');
const sopView = document.getElementById('sopView');
const placeholder = document.getElementById('placeholder');
const searchEl = document.getElementById('search');
let activeId = null;

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function renderList(filter){
  const q=(filter||'').trim().toLowerCase();
  groupsEl.innerHTML='';
  let shown=0;
  for(const g of DATA.groups){
    const items=g.ids.filter(id=>{
      const s=DATA.sops[id];
      return !q || (s.title+' '+s.model).toLowerCase().includes(q);
    });
    if(!items.length) continue;
    const sec=document.createElement('div');sec.className='group';
    const h=document.createElement('h2');h.textContent=g.name;sec.appendChild(h);
    for(const id of items){
      const s=DATA.sops[id];
      const b=document.createElement('button');
      b.className='label-strip'+(id===activeId?' active':'');
      b.innerHTML='<span class="num">'+String(id).padStart(2,'0')+'</span><span>'+esc(s.title)+'</span>';
      b.addEventListener('click',()=>showSOP(id));
      sec.appendChild(b);
      shown++;
    }
    groupsEl.appendChild(sec);
  }
  if(!shown){
    groupsEl.innerHTML='<p class="nores">No instrument matches &ldquo;'+esc(filter)+'&rdquo;. Try a shorter word.</p>';
  }
}

function showSOP(id){
  activeId=id;
  const s=DATA.sops[id];
  sopView.innerHTML=
    '<article>'+
      '<div class="sop-head">'+
        '<div class="sopno">SOP '+String(id).padStart(2,'0')+'</div>'+
        '<h2>'+esc(s.title)+'</h2>'+
        '<div class="model">'+esc(s.model)+'</div>'+
      '</div>'+
      '<div class="sop-body">'+
        '<h3>Purpose</h3><p>'+esc(s.purpose)+'</p>'+
        '<h3>Operating procedure</h3><ol>'+s.procedure.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ol>'+
        '<h3>Precautions</h3><div class="caution"><ul>'+s.precautions.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul></div>'+
        '<h3>Care and maintenance</h3><p>'+esc(s.maintenance)+'</p>'+
      '</div>'+
    '</article>';
  placeholder.style.display='none';
  document.body.classList.add('viewing');
  renderList(searchEl.value);
  if(window.innerWidth<880) window.scrollTo({top:0});
}

document.getElementById('backBtn').addEventListener('click',()=>{
  document.body.classList.remove('viewing');
  window.scrollTo({top:0});
});
searchEl.addEventListener('input',e=>renderList(e.target.value));
renderList('');
</script>
</body>
</html>
